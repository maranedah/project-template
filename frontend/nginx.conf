# Production frontend: serve the built SPA, proxy /api to the backend service.
# The backend is never exposed directly — user traffic enters only here
# (docs/03-technical/04-architecture-definition/02-connections.md).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
