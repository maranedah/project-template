# Alembic config. The DB URL comes from APP_DATABASE_SYNC_URL (see migrations/env.py);
# sqlalchemy.url below is only the host-side fallback for local runs.
[alembic]
script_location = migrations
sqlalchemy.url = postgresql+psycopg://app:app@localhost:5532/app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)s %(name)s %(message)s
